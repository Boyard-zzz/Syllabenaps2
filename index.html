<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyllabeSnap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="info">
            <button class="start-button">Start</button>
            <div class="moves">Moves: <span id="moveCount">0</span></div>
            <div class="level">Level: <span id="levelNum">1</span></div>
        </div>
        
        <div class="question-box">
            <h3 id="question">What fruit is this?</h3>
        </div>
        
        <div class="game-row">
            <div class="cards-column">
                <h4>Drag these letters</h4>
                <div class="card_container">
                    <div class="card" draggable="true"></div>
                    <div class="card" draggable="true"></div>
                    <div class="card" draggable="true"></div>
                    <div class="card" draggable="true"></div>
                </div>
            </div>
            
            <div class="outputs-column">
                <h4>Drop here in order</h4>
                <div class="outputs_container">
                    <div class="output"></div>
                    <div class="output"></div>
                    <div class="output"></div>
                    <div class="output"></div>
                </div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="again-button">Again</button>
            <button class="next-button">Next</button>
        </div>
    </div>
    
    <script src="code.js"></script>
</body>
</html>
